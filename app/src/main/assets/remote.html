<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131b"><title>MiTV Remote</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#35415e,#11141d 58%);color:#f6f7fb;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.shell{width:min(100%,390px);padding:26px 22px 24px;border:1px solid #ffffff20;border-radius:30px;background:#171b26db;box-shadow:0 24px 80px #0008;backdrop-filter:blur(20px)}header{display:flex;align-items:center;gap:13px;margin-bottom:24px}.mark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#7691d7,#3d538a);font-size:20px}h1{font-size:20px;margin:0;font-weight:650}header p{color:#a9b1c3;font-size:13px;margin:4px 0 0}.pair{display:flex;gap:9px;margin:0 0 18px}.pair input{min-width:0;flex:1;border:1px solid #ffffff20;background:#0d1018;color:#fff;border-radius:13px;padding:12px 14px;font-size:16px;letter-spacing:.2em}.pair button,.aux button{border:0;color:#fff;background:#53658e;border-radius:13px;padding:0 16px;font-weight:600}.status{min-height:18px;margin:-8px 0 14px;color:#aeb8cc;font-size:12px}.pad{width:224px;height:224px;margin:0 auto 20px;position:relative;border-radius:50%;background:radial-gradient(circle at 45% 35%,#313a4f,#1e2432 62%,#171b25);box-shadow:inset 0 1px 0 #ffffff14,0 14px 28px #0005}.key{position:absolute;border:0;color:#f6f7fb;background:transparent;font-size:23px;width:64px;height:58px;border-radius:18px;touch-action:manipulation}.key:active,.aux button:active{background:#7188b9}.up{top:8px;left:80px}.down{bottom:8px;left:80px}.left{left:8px;top:83px}.right{right:8px;top:83px}.ok{top:77px;left:77px;width:70px;height:70px;border:1px solid #ffffff18;background:#292f3e;border-radius:50%;font-size:15px;font-weight:700}.aux{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.aux button{height:43px;padding:0 8px;background:#272d3a;font-size:13px}.aux .vol{background:#202634}.foot{text-align:center;color:#858ea0;font-size:11px;margin-top:18px}@media(max-height:650px){body{padding:10px}.shell{padding:16px}.pad{width:190px;height:190px;margin-bottom:12px}.up{left:63px}.down{left:63px}.left{top:66px}.right{top:66px}.ok{top:60px;left:60px}}
</style></head><body><main class="shell"><header><div class="mark">⌂</div><div><h1>MiTV Remote</h1><p>Connect to your TV on the same Wi‑Fi</p></div></header>
<form class="pair" id="pair"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="PAIR CODE" aria-label="Pairing code"><button>Pair</button></form><div class="status" id="status">Opening this page requests a code in the TV’s top-left corner.</div>
<section class="pad" aria-label="Directional controls"><button class="key up" data-cmd="up" aria-label="Up">⌃</button><button class="key down" data-cmd="down" aria-label="Down">⌄</button><button class="key left" data-cmd="left" aria-label="Left">‹</button><button class="key right" data-cmd="right" aria-label="Right">›</button><button class="key ok" data-cmd="ok">OK</button></section>
<section class="aux"><button data-cmd="back">Back</button><button data-cmd="home">Home</button><button data-cmd="playpause">Play / Pause</button><button class="vol" data-cmd="volumedown">Volume −</button><button class="vol" data-cmd="volumeup">Volume +</button><button data-cmd="next">Next track</button></section><div class="foot">Remote controls are available only while the TV Home screen is open.</div></main>
<script>
let token=localStorage.getItem('mitv-token')||'';
const status=document.querySelector('#status'),form=document.querySelector('#pair'),pinInput=document.querySelector('#pin');
const embeddedPin=new URLSearchParams(location.hash.slice(1)).get('pair');
if(embeddedPin!==null)history.replaceState(null,'',location.pathname);
async function pair(pin){status.textContent='Pairing…';try{const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not pair');token=data.token;presence();localStorage.setItem('mitv-token',token);status.textContent='Paired. Remote is ready.';pinInput.value='';document.querySelector('#pair button').textContent='Re-pair'}catch(err){status.textContent=err.message}}
form.addEventListener('submit',event=>{event.preventDefault();pair(pinInput.value)});
if(embeddedPin&&/^\d{6}$/.test(embeddedPin)){pair(embeddedPin)}else if(token){document.querySelector('#pair button').textContent='Re-pair';status.textContent='Remote paired. Open this page again to reconnect.'}else{fetch('/pair/start',{method:'POST'}).then(()=>status.textContent='Pairing requested. Check the TV for the code.').catch(()=>status.textContent='TV is unreachable. Keep its Home screen open on this Wi-Fi.')}
async function send(command){if(!token){status.textContent='Pair first using the code shown on your TV.';return}try{const r=await fetch('/api/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,command})});if(r.status===401){token='';localStorage.removeItem('mitv-token');status.textContent='Pair again using the code shown on your TV.';fetch('/pair/start',{method:'POST'})}}catch(_){status.textContent='TV is unreachable. Keep its Home screen open on this Wi-Fi.'}}
async function presence(disconnect=false){if(!token)return;try{const r=await fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,disconnect}),keepalive:disconnect});if(r.status===401){token='';localStorage.removeItem('mitv-token');status.textContent='Pair again using the code shown on your TV.'}}catch(_){}}
setInterval(()=>{if(!document.hidden)presence()},5000);
document.addEventListener('visibilitychange',()=>presence(document.hidden));
window.addEventListener('pagehide',()=>presence(true));
if(token)presence();
document.querySelectorAll('[data-cmd]').forEach(button=>button.addEventListener('click',()=>send(button.dataset.cmd)));
</script></body></html>
