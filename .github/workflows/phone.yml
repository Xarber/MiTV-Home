name: Aurea Remote companion
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      dependency_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      platform:
        type: string
        default: all
      dependency_run:
        description: Successful full build run containing verified Python wheel artifacts
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aurea-phone-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  android:
    if: inputs.platform != 'ios'
    name: Phone Android ${{ matrix.format }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [apk, aab]
    env:
      EXPO_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
      AUREA_TARGET: remote
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Restore pinned Android Python dependencies
        uses: actions/download-artifact@v6
        with:
          pattern: apple-tv-wheels-*
          run-id: ${{ inputs.dependency_run }}
          github-token: ${{ github.token }}
          path: build/apple-tv-wheels
          merge-multiple: true
      - name: Prepare full Android host and embedded remote
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          npm run build
          mkdir -p app/src/main/assets/remoteapp
          cp -R dist/. app/src/main/assets/remoteapp/
          python3 scripts/release.py generate
          python3 scripts/release.py metadata
      - name: Prepare existing release key
        env:
          KEYSTORE: ${{ secrets.MITV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aurea-release.jks"
      - name: Build release package
        env:
          MITV_STORE_FILE: ${{ runner.temp }}/aurea-release.jks
          MITV_STORE_PASSWORD: ${{ secrets.MITV_STORE_PASSWORD }}
          MITV_KEY_ALIAS: ${{ secrets.MITV_KEY_ALIAS }}
          MITV_KEY_PASSWORD: ${{ secrets.MITV_KEY_PASSWORD }}
          FORMAT: ${{ matrix.format }}
        run: |
          if [ "$FORMAT" = apk ]; then TASK=assembleRelease; else TASK=bundleRelease; fi
          ./gradlew ":app:$TASK" -PmobileRemote -PhomeApplicationId=it.xarber.aurea.remote -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --console=plain
      - name: Validate and name artifact
        env:
          FORMAT: ${{ matrix.format }}
        run: AUREA_ANDROID_OUTPUTS=app/build/outputs python3 scripts/phone/package.py android "$FORMAT"
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-Remote-${{ github.ref_name }}-android-${{ matrix.format }}-${{ github.sha }}
          path: phone-dist/
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/aurea-release.jks"
  ios:
    if: inputs.platform != 'android'
    name: Phone iOS ${{ matrix.target }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [unsigned, simulator]
    env:
      EXPO_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
      AUREA_TARGET: remote
      FORCE_BUNDLING: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run typecheck && npm test && python3 scripts/phone/prepare.py
      - run: npx expo prebuild --platform ios --skip-dependency-update react-native,react
        working-directory: .phone-native
      - name: Compile without signing
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = simulator ]; then SDK=iphonesimulator; DEST='generic/platform=iOS Simulator'; else SDK=iphoneos; DEST='generic/platform=iOS'; fi
          xcodebuild -workspace .phone-native/ios/AureaRemote.xcworkspace -scheme AureaRemote -configuration Release -sdk "$SDK" -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/aurea-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Package and validate
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/phone/package.py ios "$TARGET"
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-Remote-${{ github.ref_name }}-ios-${{ matrix.target }}-${{ github.sha }}
          path: phone-dist/
          if-no-files-found: error
