name: Aurea Home demo
on:
  push:
    branches: [beta, main]
    paths: ['src/**', 'App.tsx', 'TVHome.tsx', 'package*.json', 'public/**', 'scripts/expo/**', '.github/workflows/demo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/expo/verify-pwa-update.mjs
      - name: Export Android demo JavaScript (not an APK)
        run: npx expo export --platform android --output-dir dist-android
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-Home-web-demo-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: Aurea-Home-demo-test-results-${{ github.sha }}
          path: playwright-results/
