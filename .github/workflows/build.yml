name: Build Aurea — all platforms
on:
  push:
    branches: [beta, main]
    paths-ignore: ['docs/**', '**.md', '.editorconfig', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    branches: [beta, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mitv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    name: iOS companion
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/phone.yml
    secrets: inherit

  web-remote:
    name: Export web and embedded remote
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run build
        env:
          EXPO_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-embedded-remote-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  web-validation:
    name: Browser and PWA validation
    needs: web-remote
    uses: ./.github/workflows/demo.yml

  apple-tv-runtime:
    name: Android dependencies ${{ matrix.abi }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install wheel build utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends patchelf
      - uses: actions/cache@v4
        id: native-wheels
        with:
          path: wheels/
          key: apple-tv-provenance-v2-cp311-${{ matrix.abi }}-${{ hashFiles('scripts/apple_tv/build_wheels.py') }}
      - name: Prepare verified dependencies automatically
        env:
          ABI: ${{ matrix.abi }}
        run: |
          if ! python scripts/apple_tv/verify_wheels.py --abi "$ABI" wheels > /dev/null 2>&1; then
            rm -rf wheels
            python scripts/apple_tv/build_wheels.py --abi "$ABI" --work "$RUNNER_TEMP/apple-tv" --output wheels
          fi
      - name: Verify native wheel provenance and bytes
        run: python scripts/apple_tv/verify_wheels.py --abi '${{ matrix.abi }}' wheels
      - uses: actions/upload-artifact@v5
        with:
          name: apple-tv-wheels-${{ matrix.abi }}-${{ github.sha }}
          path: wheels/
          if-no-files-found: error

  apple-tv-pure:
    name: Shared Python dependencies
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/apple_tv/build_pure_wheels.py --output wheels
      - name: Verify tvOS 27 pairing header on every handshake request
        env:
          MITV_PYATV_WHEEL: wheels/pyatv-0.18.0-py3-none-any.whl
        run: python -m unittest discover -s tests/python -p test_tvos27_pairing_headers.py -v
      - name: Verify real SRP exchange with Android dependency versions
        run: |
          python -m pip install wheels/pyatv-0.18.0-py3-none-any.whl srptools==2.0.0 cryptography==50.0.2
          python -m unittest discover -s tests/python -p test_srp_compatibility.py -v
          python -m unittest discover -s tests/python -p test_voice_session.py -v
          python -m unittest discover -s tests/python -p test_system_remote.py -v
      - uses: actions/upload-artifact@v5
        with:
          name: apple-tv-wheels-pure-${{ github.sha }}
          path: wheels/
          if-no-files-found: error

  checks:
    name: Host and release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-host.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run typecheck && npm test

  android:
    needs: [apple-tv-runtime, apple-tv-pure, web-remote]
    name: Android ${{ matrix.target }} ${{ matrix.format }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target: [tv, remote]
        format: [apk, aab]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MITV_BUILD_CHANNEL: ${{ github.ref_name }}
      EXPO_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
      AUREA_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Collect exact-run Android Python dependencies
        uses: actions/download-artifact@v6
        with:
          pattern: apple-tv-wheels-*-${{ github.sha }}
          path: build/apple-tv-wheels
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: Aurea-embedded-remote-${{ github.sha }}
          path: app/src/main/assets/remoteapp
      - uses: gradle/actions/setup-gradle@v5
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Embed exact commit and history
        run: |
          python3 scripts/release.py generate
          python3 scripts/release.py metadata
      - name: Prepare existing release signing key
        env:
          KEYSTORE: ${{ secrets.MITV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mitv-release.jks"
      - name: Compile release from native source
        env:
          MITV_STORE_FILE: ${{ runner.temp }}/mitv-release.jks
          MITV_STORE_PASSWORD: ${{ secrets.MITV_STORE_PASSWORD }}
          MITV_KEY_ALIAS: ${{ secrets.MITV_KEY_ALIAS }}
          MITV_KEY_PASSWORD: ${{ secrets.MITV_KEY_PASSWORD }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          TARGET: ${{ matrix.target }}
        run: |
          FLAGS=("-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --max-workers=2)
          if [ "$TARGET" = remote ]; then FLAGS+=(-PmobileRemote -PhomeApplicationId=it.xarber.aurea.remote); fi
          if [ "$PACKAGE_FORMAT" = apk ]; then TASK=assembleRelease; else TASK=bundleRelease; fi
          ./gradlew :app:compileReleaseJavaWithJavac "${FLAGS[@]}" --console=plain --stacktrace
          ./gradlew ":app:$TASK" "${FLAGS[@]}" --console=plain --stacktrace
      - name: Verify signed packages and embedded provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = remote ]; then
            AUREA_ANDROID_OUTPUTS=app/build/outputs python3 scripts/phone/package.py android "$PACKAGE_FORMAT"
            if [ "$PACKAGE_FORMAT" = aab ]; then
              gh api repos/google/bundletool/releases/tags/1.18.3 > "$RUNNER_TEMP/bundletool-release.json"
              python3 scripts/fetch_bundletool.py "$RUNNER_TEMP/bundletool-release.json" "$RUNNER_TEMP/bundletool.jar"
              java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=app/build/outputs/bundle/release/app-release.aab
              java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=app/build/outputs/bundle/release/app-release.aab --module=base > "$RUNNER_TEMP/phone-manifest.xml"
              VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
              CODE="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["android"]["versionCode"])')"
              python3 scripts/validate_manifest.py "$RUNNER_TEMP/phone-manifest.xml" "$VERSION" "$CODE" it.xarber.aurea.remote
            fi
            exit 0
          fi
          mkdir -p dist
          VERSION="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/build-metadata.json"))["version"])')"
          CODE="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/build-metadata.json"))["code"])')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$PACKAGE_FORMAT" = apk ]; then
            FILE="dist/MiTV-Home-v${VERSION}-android-universal-${MITV_BUILD_CHANNEL}-github-extended-${SHORT_SHA}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$FILE"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$FILE"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$FILE" > "$RUNNER_TEMP/apk-signers.txt"
            python3 scripts/update_manifest.py package --apk "$FILE" --report "$RUNNER_TEMP/apk-signers.txt" --commit "$GITHUB_SHA" --channel "$MITV_BUILD_CHANNEL"
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$FILE" > "$RUNNER_TEMP/badging.txt"
            grep -F "name='it.xarber.mitvhome'" "$RUNNER_TEMP/badging.txt"
            grep -F "versionCode='$CODE'" "$RUNNER_TEMP/badging.txt"
            grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
            ! grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          else
            FILE="dist/MiTV-Home-v${VERSION}-android-${MITV_BUILD_CHANNEL}-github-extended-${SHORT_SHA}.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$FILE"
            jarsigner -verify "$FILE" | tee "$RUNNER_TEMP/aab-signature.txt"
            grep -q 'jar verified' "$RUNNER_TEMP/aab-signature.txt"
            gh api repos/google/bundletool/releases/tags/1.18.3 > "$RUNNER_TEMP/bundletool-release.json"
            python3 scripts/fetch_bundletool.py "$RUNNER_TEMP/bundletool-release.json" "$RUNNER_TEMP/bundletool.jar"
            java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$FILE"
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$FILE" --module=base > "$RUNNER_TEMP/bundle-manifest.xml"
            python3 scripts/validate_manifest.py "$RUNNER_TEMP/bundle-manifest.xml" "$VERSION" "$CODE"
          fi
          python3 scripts/release.py validate --file "$FILE" --kind "$PACKAGE_FORMAT"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target == 'remote' && 'Aurea-Remote' || 'MiTV-Home' }}-${{ github.ref_name }}-android-${{ matrix.format }}-${{ github.sha }}
          path: ${{ matrix.target == 'remote' && 'phone-dist/' || 'dist/' }}
          if-no-files-found: error
          retention-days: 30
      - name: Android lint
        env:
          TARGET: ${{ matrix.target }}
        run: |
          FLAGS=("-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --max-workers=2)
          if [ "$TARGET" = remote ]; then FLAGS+=(-PmobileRemote -PhomeApplicationId=it.xarber.aurea.remote); fi
          ./gradlew :app:lintRelease "${FLAGS[@]}" --console=plain
      - name: Retain lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-${{ matrix.target }}-${{ matrix.format }}-${{ github.sha }}
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mitv-release.jks"

  source:
    name: Corresponding source
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: |
          mkdir -p dist
          python3 scripts/source_archive.py "dist/MiTV-Home-source-${GITHUB_SHA:0:7}.tar.gz"
          cd dist
          sha256sum *.tar.gz > SOURCE-SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: MiTV-Home-${{ github.ref_name }}-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated channel
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'beta')
    needs: [checks, web-validation, android, source, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          pattern: MiTV-Home-${{ github.ref_name }}-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          pattern: Aurea-Remote-${{ github.ref_name }}-*-${{ github.sha }}
          path: dist/companions
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: Aurea-embedded-remote-${{ github.sha }}
          path: web-dist/
      - name: Validate all companion artifacts and package web
        run: python3 scripts/ci/release_collection.py
      - name: Publish exact validated artifact collection
        env:
          GH_TOKEN: ${{ github.token }}
          MITV_BUILD_CHANNEL: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.aab' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum --check ./*.sha256 SOURCE-SHA256SUMS.txt
          sha256sum ./*.apk ./*.aab ./*.tar.gz > SHA256SUMS.txt
          cd ..
          VERSION="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/release-history.json"))["releases"][0]["version"])')"
          CODE="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/release-history.json"))["releases"][0]["code"])')"
          TAG="v${VERSION}"
          RELEASE_ARGS=()
          if [ "$MITV_BUILD_CHANNEL" = beta ]; then TAG="${TAG}-beta.${CODE}.${GITHUB_SHA:0:7}"; RELEASE_ARGS+=(--prerelease --latest=false); fi
          # A build must never retarget/overwrite an existing release or version tag.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release already exists: $TAG; bump version before publishing." >&2; exit 1; fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"; fi
          python3 scripts/update_manifest.py manifest --dir dist --tag "$TAG" --commit "$GITHUB_SHA" --channel "$MITV_BUILD_CHANNEL"
          python3 scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          cp distribution/obtainium.json dist/obtainium.json
          cp distribution/obtainium-beta.json dist/obtainium-beta.json
          (cd dist && sha256sum ./*.apk ./*.aab ./*.tar.gz update-manifest.json obtainium.json obtainium-beta.json > SHA256SUMS.txt)
          python3 scripts/ci/release_collection.py --checksums
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Aurea Home $VERSION ($MITV_BUILD_CHANNEL)" --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_ARGS[@]}" dist/*.apk dist/*.aab dist/*.tar.gz dist/SHA256SUMS.txt dist/obtainium.json dist/obtainium-beta.json dist/update-manifest.json dist/companions/*
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -ge 21
          if [ "$MITV_BUILD_CHANNEL" = beta ]; then gh release edit "$TAG" --draft=false --latest=false; else gh release edit "$TAG" --draft=false --latest; fi
          python3 scripts/check_published_update.py dist/update-manifest.json

  summary:
    name: Build results
    if: always()
    needs: [checks, web-remote, web-validation, apple-tv-runtime, apple-tv-pure, android, ios, source, publish, distribution-sources]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Explain all build results
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/summary.py

  distribution-sources:
    name: Update AltSource and Obtainium sources
    concurrency:
      group: aurea-distribution-sources
      cancel-in-progress: false
    needs: publish
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'beta')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: Aurea-Remote-${{ github.ref_name }}-ios-unsigned-${{ github.sha }}
          path: source-artifact/
          merge-multiple: true
      - name: Generate and publish actual release sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          CODE="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["ios"]["buildNumber"])')"
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_NAME" = beta ]; then TAG="${TAG}-beta.${CODE}.${GITHUB_SHA:0:7}"; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/actual-release.json"
          mkdir -p source-history distribution-generated
          if gh release view sources-v1.0 > /dev/null 2>&1; then
            gh release download sources-v1.0 --pattern 'altsource*.json' --dir source-history --clobber
          fi
          python3 scripts/distribution/sources.py --release "$RUNNER_TEMP/actual-release.json" --sidecar source-artifact/*.ipa.json --previous source-history --out distribution-generated
          cp distribution/obtainium*.json distribution-generated/
          cp public/branding/icon-512.png distribution-generated/
          if ! gh release view sources-v1.0 > /dev/null 2>&1; then
            gh release create sources-v1.0 --latest=false --title 'Aurea distribution sources' --notes 'Mutable installation metadata only. Application versions are separate releases.'
          fi
          gh release upload sources-v1.0 distribution-generated/* --clobber
          python3 scripts/distribution/verify_public.py
