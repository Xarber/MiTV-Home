name: Build MiTV Home
on:
  push:
    branches: [main, beta]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  android:
    if: github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android tools
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' 
      - name: Prepare release signing
        env:
          KEYSTORE: ${{ secrets.MITV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mitv-release.jks"
      - name: Build from source and run lint
        env:
          MITV_STORE_FILE: ${{ runner.temp }}/mitv-release.jks
          MITV_STORE_PASSWORD: ${{ secrets.MITV_STORE_PASSWORD }}
          MITV_KEY_ALIAS: ${{ secrets.MITV_KEY_ALIAS }}
          MITV_KEY_PASSWORD: ${{ secrets.MITV_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --console=plain --stacktrace
      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MiTV-Home.apk
          cd dist
          sha256sum MiTV-Home.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: MiTV-Home-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mitv-release.jks"

  publish:
    if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Attach the validated build for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          BUILD_RUN=""
          for attempt in $(seq 1 24); do
            BUILD_RUN="$(gh run list --workflow build.yml --branch main --event push --commit "$COMMIT" --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$BUILD_RUN" ]; then break; fi
            sleep 5
          done
          test -n "$BUILD_RUN"
          gh run watch "$BUILD_RUN" --exit-status --interval 30
          gh run download "$BUILD_RUN" --name "MiTV-Home-main-$COMMIT" --dir dist
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release upload "$RELEASE_TAG" dist/MiTV-Home.apk dist/SHA256SUMS.txt --clobber
