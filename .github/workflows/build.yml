name: Build MiTV Home
on:
  push:
    branches: [beta, main]
    paths-ignore: ['docs/**', '**.md', '.editorconfig', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      expo_preview:
        description: Build isolated Expo TV preview using verified unchanged media bytes (not a release)
        type: boolean
        default: false
      apple_tv_preflight:
        description: Build Android Apple TV client dependencies only
        type: boolean
        default: false
      apple_tv_dependency_run:
        description: Optional successful same-repository native dependency run to reuse
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mitv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  expo-preview:
    name: Expo TV ARM preview (no publication)
    if: github.event_name == 'workflow_dispatch' && inputs.expo_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci && npm run typecheck && npm test && npm run build
      - name: Restore verified Android dependency wheels
        uses: actions/download-artifact@v6
        with:
          pattern: apple-tv-wheels-*
          run-id: 40701926505
          github-token: ${{ github.token }}
          path: build/apple-tv-wheels
          merge-multiple: true
      - name: Prepare unchanged media and embedded web remote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.5 --repo Xarber/MiTV-Home --pattern '*universal*.apk' --dir "$RUNNER_TEMP/media"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$RUNNER_TEMP"/media/*.apk | grep -F 'a57dfea6154bf320e051cdfd304b1aa7976559f7239fdbde6fcea265a9f93724'
          python3 scripts/expo/preview-native.py "$RUNNER_TEMP"/media/*.apk build/preview-native
          mkdir -p app/src/main/assets/remoteapp
          cp -R dist/. app/src/main/assets/remoteapp/
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build isolated release-mode preview
        run: ./gradlew :app:assembleRelease -PuseBundledNative -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -PhomeApplicationId=it.xarber.mitvhome.preview -PbundledNativeRoot="$GITHUB_WORKSPACE/build/preview-native" --console=plain
      - name: Sign isolated preview with the established release key
        env:
          KEYSTORE: ${{ secrets.MITV_KEYSTORE_BASE64 }}
          MITV_STORE_PASSWORD: ${{ secrets.MITV_STORE_PASSWORD }}
          MITV_KEY_ALIAS: ${{ secrets.MITV_KEY_ALIAS }}
          MITV_KEY_PASSWORD: ${{ secrets.MITV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/preview.jks"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p preview-dist
          "$SIGNER" sign --ks "$RUNNER_TEMP/preview.jks" --ks-key-alias "$MITV_KEY_ALIAS" --ks-pass env:MITV_STORE_PASSWORD --key-pass env:MITV_KEY_PASSWORD --out "preview-dist/Aurea-Home-v${VERSION}-preview-${GITHUB_SHA:0:7}-arm.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$SIGNER" verify preview-dist/*.apk
          sha256sum preview-dist/*.apk > preview-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-Expo-TV-preview-${{ github.sha }}
          path: preview-dist/
          if-no-files-found: error
      - if: always()
        run: rm -f "$RUNNER_TEMP/preview.jks"

  phone-companion:
    name: Phone companion formats
    if: github.event_name != 'pull_request' && !inputs.expo_preview && !inputs.apple_tv_preflight
    uses: ./.github/workflows/phone.yml
    secrets: inherit

  web-remote:
    name: Embedded phone web remote
    if: github.event_name != 'pull_request' && !inputs.expo_preview && !inputs.apple_tv_preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        env:
          EXPO_PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium && npm run test:e2e && node scripts/expo/verify-pwa-update.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: Aurea-embedded-remote-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  apple-tv-runtime:
    name: Apple TV runtime ${{ matrix.abi }}
    if: github.event_name != 'pull_request' && !inputs.expo_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install wheel build utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends patchelf
      - uses: actions/cache@v4
        id: native-wheels
        with:
          path: wheels/
          key: apple-tv-cp311-${{ matrix.abi }}-${{ hashFiles('scripts/apple_tv/build_wheels.py') }}
      - name: Reuse previously compiled pinned dependencies
        if: inputs.apple_tv_dependency_run != ''
        uses: actions/download-artifact@v6
        with:
          pattern: apple-tv-wheels-${{ matrix.abi }}-*
          run-id: ${{ inputs.apple_tv_dependency_run }}
          github-token: ${{ github.token }}
          path: wheels
          merge-multiple: true
      - name: Cross-compile pinned dependencies
        if: steps.native-wheels.outputs.cache-hit != 'true' && inputs.apple_tv_dependency_run == ''
        run: python scripts/apple_tv/build_wheels.py --abi '${{ matrix.abi }}' --work "$RUNNER_TEMP/apple-tv" --output wheels
      - name: Verify native wheel provenance and bytes
        run: python scripts/apple_tv/verify_wheels.py --abi '${{ matrix.abi }}' wheels
      - uses: actions/upload-artifact@v5
        with:
          name: apple-tv-wheels-${{ matrix.abi }}-${{ github.sha }}
          path: wheels/
          if-no-files-found: error

  apple-tv-pure:
    name: Apple TV portable Python dependencies
    if: github.event_name != 'pull_request' && !inputs.expo_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/apple_tv/build_pure_wheels.py --output wheels
      - name: Verify tvOS 27 pairing header on every handshake request
        env:
          MITV_PYATV_WHEEL: wheels/pyatv-0.18.0-py3-none-any.whl
        run: python -m unittest discover -s tests/python -p test_tvos27_pairing_headers.py -v
      - name: Verify real SRP exchange with Android dependency versions
        run: |
          python -m pip install wheels/pyatv-0.18.0-py3-none-any.whl srptools==2.0.0 cryptography==50.0.2
          python -m unittest discover -s tests/python -p test_srp_compatibility.py -v
      - uses: actions/upload-artifact@v5
        with:
          name: apple-tv-wheels-pure-${{ github.sha }}
          path: wheels/
          if-no-files-found: error

  checks:
    name: Host and release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-host.sh
      - uses: actions/setup-node@v6
        if: github.event_name == 'pull_request'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npm run typecheck && npm test
        if: github.event_name == 'pull_request'

  android:
    needs: [apple-tv-runtime, apple-tv-pure, web-remote]
    name: Android ${{ matrix.format }}
    if: github.event_name != 'pull_request' && !inputs.expo_preview && !inputs.apple_tv_preflight
    strategy:
      fail-fast: false
      matrix:
        format: [apk, aab]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MITV_BUILD_CHANNEL: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Collect exact-run Android Python dependencies
        uses: actions/download-artifact@v6
        with:
          pattern: apple-tv-wheels-*-${{ github.sha }}
          path: build/apple-tv-wheels
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: Aurea-embedded-remote-${{ github.sha }}
          path: app/src/main/assets/remoteapp
      - uses: gradle/actions/setup-gradle@v5
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Embed exact commit and history
        run: |
          python3 scripts/release.py generate
          python3 scripts/release.py metadata
      - name: Prepare existing release signing key
        env:
          KEYSTORE: ${{ secrets.MITV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mitv-release.jks"
      - name: Compile release from native source
        env:
          MITV_STORE_FILE: ${{ runner.temp }}/mitv-release.jks
          MITV_STORE_PASSWORD: ${{ secrets.MITV_STORE_PASSWORD }}
          MITV_KEY_ALIAS: ${{ secrets.MITV_KEY_ALIAS }}
          MITV_KEY_PASSWORD: ${{ secrets.MITV_KEY_PASSWORD }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          if [ "$PACKAGE_FORMAT" = apk ]; then
            ./gradlew :app:assembleRelease :app:lintRelease --console=plain --stacktrace
          else
            ./gradlew :app:bundleRelease :app:lintRelease --console=plain --stacktrace
          fi
      - name: Verify signed packages and embedded provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p dist
          VERSION="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/build-metadata.json"))["version"])')"
          CODE="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/build-metadata.json"))["code"])')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$PACKAGE_FORMAT" = apk ]; then
            FILE="dist/MiTV-Home-v${VERSION}-android-universal-${MITV_BUILD_CHANNEL}-github-extended-${SHORT_SHA}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$FILE"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$FILE"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$FILE" > "$RUNNER_TEMP/apk-signers.txt"
            python3 scripts/update_manifest.py package --apk "$FILE" --report "$RUNNER_TEMP/apk-signers.txt" --commit "$GITHUB_SHA" --channel "$MITV_BUILD_CHANNEL"
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$FILE" > "$RUNNER_TEMP/badging.txt"
            grep -F "name='it.xarber.mitvhome'" "$RUNNER_TEMP/badging.txt"
            grep -F "versionCode='$CODE'" "$RUNNER_TEMP/badging.txt"
            grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
            ! grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          else
            FILE="dist/MiTV-Home-v${VERSION}-android-${MITV_BUILD_CHANNEL}-github-extended-${SHORT_SHA}.aab"
            cp app/build/outputs/bundle/release/app-release.aab "$FILE"
            jarsigner -verify "$FILE" | tee "$RUNNER_TEMP/aab-signature.txt"
            grep -q 'jar verified' "$RUNNER_TEMP/aab-signature.txt"
            gh api repos/google/bundletool/releases/tags/1.18.3 > "$RUNNER_TEMP/bundletool-release.json"
            python3 scripts/fetch_bundletool.py "$RUNNER_TEMP/bundletool-release.json" "$RUNNER_TEMP/bundletool.jar"
            java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$FILE"
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$FILE" --module=base > "$RUNNER_TEMP/bundle-manifest.xml"
            python3 scripts/validate_manifest.py "$RUNNER_TEMP/bundle-manifest.xml" "$VERSION" "$CODE"
          fi
          python3 scripts/release.py validate --file "$FILE" --kind "$PACKAGE_FORMAT"
      - uses: actions/upload-artifact@v5
        with:
          name: MiTV-Home-${{ github.ref_name }}-${{ matrix.format }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-${{ matrix.format }}-${{ github.sha }}
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mitv-release.jks"

  source:
    name: Corresponding source
    if: github.event_name != 'pull_request' && !inputs.expo_preview && !inputs.apple_tv_preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: |
          mkdir -p dist
          python3 scripts/source_archive.py "dist/MiTV-Home-source-${GITHUB_SHA:0:7}.tar.gz"
          cd dist
          sha256sum *.tar.gz > SOURCE-SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: MiTV-Home-${{ github.ref_name }}-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated channel
    if: github.event_name != 'pull_request' && !inputs.expo_preview && !inputs.apple_tv_preflight && (github.ref_name == 'main' || github.ref_name == 'beta')
    needs: [checks, android, source, phone-companion]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          pattern: MiTV-Home-${{ github.ref_name }}-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Publish exact validated artifact collection
        env:
          GH_TOKEN: ${{ github.token }}
          MITV_BUILD_CHANNEL: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.aab' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum --check ./*.sha256 SOURCE-SHA256SUMS.txt
          sha256sum ./*.apk ./*.aab ./*.tar.gz > SHA256SUMS.txt
          cd ..
          VERSION="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/release-history.json"))["releases"][0]["version"])')"
          CODE="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/release-history.json"))["releases"][0]["code"])')"
          TAG="v${VERSION}"
          RELEASE_ARGS=()
          if [ "$MITV_BUILD_CHANNEL" = beta ]; then TAG="${TAG}-beta.${CODE}.${GITHUB_SHA:0:7}"; RELEASE_ARGS+=(--prerelease --latest=false); fi
          # A build must never retarget/overwrite an existing release or version tag.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release already exists: $TAG; bump version before publishing." >&2; exit 1; fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"; fi
          python3 scripts/update_manifest.py manifest --dir dist --tag "$TAG" --commit "$GITHUB_SHA" --channel "$MITV_BUILD_CHANNEL"
          python3 scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          cp distribution/obtainium.json dist/obtainium.json
          cp distribution/obtainium-beta.json dist/obtainium-beta.json
          (cd dist && sha256sum ./*.apk ./*.aab ./*.tar.gz update-manifest.json obtainium.json obtainium-beta.json > SHA256SUMS.txt)
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "MiTV Home $VERSION ($MITV_BUILD_CHANNEL)" --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_ARGS[@]}" dist/*.apk dist/*.aab dist/*.tar.gz dist/SHA256SUMS.txt dist/obtainium.json dist/obtainium-beta.json dist/update-manifest.json
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -ge 7
          if [ "$MITV_BUILD_CHANNEL" = beta ]; then gh release edit "$TAG" --draft=false --latest=false; else gh release edit "$TAG" --draft=false --latest; fi
          python3 scripts/check_published_update.py dist/update-manifest.json
